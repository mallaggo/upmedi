{% extends "base.html" %}
{% load static %}


{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="text-uppercase">학생 전시관</h1>
        <p class="text-muted">
            학생들이 직접 만든 홈페이지를 만나 보세요.
        </p>
    </div>

    <div class="row g-4">

        {% for student in students %}
        <div class="col-12 col-sm-6 col-lg-4">

            <div class="card h-100 shadow-sm">

                <a href="{{ student.url }}"
                   target="_blank"
                   rel="noopener noreferrer">

                    <img src="{% static student.thumbnail %}"
                         class="card-img-top"
                         alt="{{ student.name }}"
                         style="height: 220px; object-fit: cover;">

                </a>

                <div class="card-body text-center">

                    <h5 class="card-title">
                        {{ student.name }}
                    </h5>

                    <p class="card-text text-muted">
                        {{ student.description }}
                    </p>

                    <a href="{{ student.url }}"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="btn btn-primary">
                        홈페이지 방문
                    </a>

                </div>
            </div>

        </div>
        {% empty %}
        <div class="col-12 text-center">
            <p>아직 등록된 학생 작품이 없습니다.</p>
        </div>
        {% endfor %}

    </div>
</div>

{% endblock %}
